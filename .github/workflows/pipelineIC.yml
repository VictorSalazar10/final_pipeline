name: Pipeline_Examen
on:
  push:
    branches:
      - feat_pipeline 

jobs: 


#-----------------------------DAST------------------------------------------------ 

  DAST:
    
    runs-on: self-hosted
    steps:
    
    - name : Desplegar Aplicacion en Docker
      run : |
        docker run -d -p 3000:3000 --name app_examen vsvu1001/final_pipeline:latest

    - name  : Esperar 30 segundos para que la aplicación esté lista
      run : |
        sleep 30

    - name: Ejecutar ZAP desde Windows
      run: |
        & "C:\Program Files\ZAP\Zed Attack Proxy\zap.bat" -cmd -quickurl http://localhost:3000 -quickout zap_report.html
      shell: powershell

    - name: Subir reporte
      uses: actions/upload-artifact@master
      with:
        name: zap-report
        path: zap_report.html