name: Pipeline_Examen
on:
  push:
    branches:
      - feat_pipeline 

jobs: 
  DAST:
    
    runs-on: self-hosted
    steps:
      - name: Crear red Docker
        run: |
          docker network rm zap-net 
          docker network create zap-net

      - name: Desplegar aplicación
        run: |
          docker run -d --rm --network zap-net --name app_examen -p 3000:3000 vsvu1001/final_pipeline:latest
                    
      - name: Esperar que la aplicación esté lista
        run: |
          sleep 10

      - name: Escaneo con OWASP ZAP
        run: |
          docker run --rm --network zap-net -v ${{ github.workspace }}:/zap/wrk/:rw ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://app_examen:3000/ -J report_json.json -w report_md.md -r report_html.html -I
         

      - name: Mover reportes de ZAP al directorio reports
        run: |
          mkdir -p reports
          mv report_*.json reports/ 
          mv report_*.md reports/ 
          mv report_*.html reports/ 

      - name: Upload OWASP ZAP Report
        uses: actions/upload-artifact@master
        with:
          name: owasp-zap-report
          path: ${{ github.workspace }}/reports