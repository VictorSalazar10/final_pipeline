name: Pipeline_Examen
on:
  push:
    branches:
      - feat_pipeline 

jobs: 


#-----------------------------DAST------------------------------------------------ 

  DAST:
    
    runs-on: self-hosted
    steps:
    
    - name : Desplegar Aplicacion en Docker
      run : |
        docker run -d -p 3000:3000 --name app_examen vsvu1001/final_pipeline:latest

    - name  : Esperar 30 segundos para que la aplicación esté lista
      run : |
        sleep 10

    - name: Escaneo con OWASP ZAP
      run: |
        docker run --rm \
        --network zap-net \
        -v ${{ github.workspace }}:/zap/wrk/:rw \
        ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
        -t http://app_examen:3000/ \
        -J report_json.json -w report_md.md -r report_html.html \
        -I

    - name: Mover reportes de ZAP al directorio reports
      run: |
        mkdir -p reports
        mv report_*.json reports/ || true
        mv report_*.md reports/ || true
        mv report_*.html reports/ || true

    - name: Upload OWASP ZAP Report
      uses: actions/upload-artifact@master
      with:
        name: owasp-zap-report
        path: ${{ github.workspace }}/reports